name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    name: Tag must point to default branch HEAD
    runs-on: ubuntu-22.04

    steps:
      - name: Verify tag is on default branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .sha)

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME and $branch point to $head — building."
            exit 0
          fi

          echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, but $branch points to $head."
          exit 1

  cli:
    name: Headless CLI — Linux aarch64 musl
    needs: guard
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static aarch64-musl CLI
        env:
          TARGET: aarch64-unknown-linux-musl
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/home/rust/src" \
            -w /home/rust/src \
            messense/rust-musl-cross:aarch64-musl \
            cargo build \
              --release \
              --locked \
              --no-default-features \
              --features cli \
              --bin tglock-cli \
              --target "$TARGET"

          cp \
            "target/$TARGET/release/tglock-cli" \
            "$ASSET"

          chmod +x "$ASSET"

      - name: Verify ELF architecture and static linking
        env:
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          echo "=== file ==="
          file "$ASSET"

          echo "=== ELF header ==="
          readelf -h "$ASSET"

          echo "=== program headers ==="
          readelf -l "$ASSET"

          echo "=== dynamic dependencies ==="
          readelf -d "$ASSET" || true

          # Must be a 64-bit ARM executable.
          file "$ASSET" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

          # A fully static executable must not contain PT_INTERP.
          if readelf -l "$ASSET" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked: PT_INTERP exists."
            exit 1
          fi

          # A static binary should have no NEEDED shared libraries.
          if readelf -d "$ASSET" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Binary has dynamic shared-library dependencies."
            readelf -d "$ASSET"
            exit 1
          fi

          echo "Static aarch64-musl binary verified."

      - name: Strip binary
        env:
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/home/rust/src" \
            -w /home/rust/src \
            messense/rust-musl-cross:aarch64-musl \
            musl-strip "/home/rust/src/$ASSET"

      - name: Verify stripped binary again
        env:
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          file "$ASSET"

          if readelf -l "$ASSET" | grep -q 'INTERP'; then
            echo "::error::Stripped binary contains PT_INTERP."
            exit 1
          fi

          if readelf -d "$ASSET" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Stripped binary has dynamic dependencies."
            exit 1
          fi

          echo "Final binary is static."

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: tglock-cli-aarch64-unknown-linux-musl
