name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    name: Tag must point to default branch HEAD
    runs-on: ubuntu-22.04

    steps:
      - name: Verify tag is on default branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .sha)

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME and $branch point to $head — building."
            exit 0
          fi

          echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, but $branch points to $head."
          exit 1

  cli:
    name: Static CLI — aarch64-unknown-linux-musl
    needs: guard
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross compilation tools
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            musl-tools \
            pkg-config \
            perl \
            make \
            gcc \
            g++ \
            cmake

      - name: Install cross
        run: |
          set -euxo pipefail

          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build static CLI
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_VENDORED: "1"
          OPENSSL_NO_VENDOR: "0"
        run: |
          set -euxo pipefail

          cross build \
            --release \
            --locked \
            --no-default-features \
            --features cli \
            --bin tglock-cli \
            --target aarch64-unknown-linux-musl

      - name: Prepare binary
        run: |
          set -euxo pipefail

          cp \
            target/aarch64-unknown-linux-musl/release/tglock-cli \
            tglock-cli-aarch64-unknown-linux-musl

          chmod +x tglock-cli-aarch64-unknown-linux-musl

      - name: Verify architecture
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          echo "=== file ==="
          file "$binary"

          file "$binary" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

      - name: Verify static linking
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          echo "=== program headers ==="
          readelf -l "$binary"

          echo "=== dynamic section ==="
          readelf -d "$binary" || true

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked: PT_INTERP found."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Binary has dynamic shared-library dependencies."
            readelf -d "$binary"
            exit 1
          fi

          echo "OK: static aarch64-musl binary."

      - name: Strip binary
        run: |
          set -euxo pipefail

          binary="$GITHUB_WORKSPACE/tglock-cli-aarch64-unknown-linux-musl"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            messense/rust-musl-cross:aarch64-musl \
            musl-strip \
            "/work/$(basename "$binary")"

      - name: Final verification
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          file "$binary"

          file "$binary" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Final binary contains PT_INTERP."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Final binary has dynamic dependencies."
            readelf -d "$binary"
            exit 1
          fi

          echo "========================================"
          echo "FINAL BINARY:"
          echo "  aarch64"
          echo "  musl"
          echo "  statically linked"
          echo "========================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: tglock-cli-aarch64-unknown-linux-musl
