name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Static CLI — aarch64-unknown-linux-musl
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout TGLock
        uses: actions/checkout@v6
        with:
          repository: by-sonic/tglock
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify Cargo project
        run: |
          set -euxo pipefail

          pwd
          ls -la

          test -f Cargo.toml
          test -f Cargo.lock

          cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Build static CLI
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/rust/src" \
            -w /home/rust/src \
            -e OPENSSL_STATIC=1 \
            -e OPENSSL_NO_VENDOR=0 \
            -e PKG_CONFIG_ALLOW_CROSS=1 \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            bash -lc '
              set -euxo pipefail

              export PATH="/usr/local/musl/bin:$PATH"

              cargo build \
                --release \
                --locked \
                --no-default-features \
                --features cli \
                --bin tglock-cli \
                --target aarch64-unknown-linux-musl
            '

      - name: Copy binary
        run: |
          set -euxo pipefail

          cp \
            target/aarch64-unknown-linux-musl/release/tglock-cli \
            tglock-cli-aarch64-unknown-linux-musl

          chmod +x tglock-cli-aarch64-unknown-linux-musl

      - name: Verify ARM64
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          file "$binary"

          file "$binary" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

      - name: Verify static linking
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          echo "=== Program headers ==="
          readelf -l "$binary"

          echo "=== Dynamic section ==="
          readelf -d "$binary" || true

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::PT_INTERP found — binary is dynamically linked."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::DT_NEEDED found — binary has shared-library dependencies."
            readelf -d "$binary"
            exit 1
          fi

          echo "Static aarch64-musl binary verified."

      - name: Strip
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            musl-strip \
            /work/tglock-cli-aarch64-unknown-linux-musl

      - name: Final verification
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          file "$binary"

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Final binary contains PT_INTERP."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Final binary has dynamic dependencies."
            exit 1
          fi

          echo "======================================"
          echo "SUCCESS"
          echo "Target: aarch64-unknown-linux-musl"
          echo "Linking: static"
          echo "Binary: $binary"
          echo "======================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: tglock-cli-aarch64-unknown-linux-musl
