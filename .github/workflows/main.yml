name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    name: Tag must point to default branch HEAD
    runs-on: ubuntu-22.04

    steps:
      - name: Verify tag is on default branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .sha)

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME and $branch point to $head — building."
            exit 0
          fi

          echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, but $branch points to $head."
          exit 1

  cli:
    name: Static CLI — aarch64-unknown-linux-musl
    needs: guard
    runs-on: ubuntu-22.04

    container:
      image: messense/rust-musl-cross:aarch64-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: src

      - name: Show workspace
        run: |
          set -eux

          pwd
          ls -la
          ls -la src
          test -f src/Cargo.toml

      - name: Build static CLI
        working-directory: src
        run: |
          set -euxo pipefail

          cargo build \
            --release \
            --locked \
            --no-default-features \
            --features cli \
            --bin tglock-cli

      - name: Prepare release binary
        working-directory: src
        run: |
          set -euxo pipefail

          cp \
            target/aarch64-unknown-linux-musl/release/tglock-cli \
            ../tglock-cli-aarch64-unknown-linux-musl

          chmod +x ../tglock-cli-aarch64-unknown-linux-musl

      - name: Verify architecture
        working-directory: src
        run: |
          set -euxo pipefail

          file ../tglock-cli-aarch64-unknown-linux-musl

          file ../tglock-cli-aarch64-unknown-linux-musl | \
            grep -E 'ELF 64-bit.*ARM aarch64.*executable'

      - name: Verify static linking
        working-directory: src
        run: |
          set -euxo pipefail

          binary="../tglock-cli-aarch64-unknown-linux-musl"

          echo "=== ELF header ==="
          readelf -h "$binary"

          echo "=== Program headers ==="
          readelf -l "$binary"

          echo "=== Dynamic section ==="
          readelf -d "$binary" || true

          # Static executable must not have an ELF interpreter.
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked: PT_INTERP found."
            exit 1
          fi

          # Static executable must not depend on shared libraries.
          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Binary has dynamic shared-library dependencies."
            readelf -d "$binary"
            exit 1
          fi

          echo "OK: static aarch64-musl executable."

      - name: Strip binary
        working-directory: src
        run: |
          set -euxo pipefail

          musl-strip \
            ../tglock-cli-aarch64-unknown-linux-musl

      - name: Final verification
        working-directory: src
        run: |
          set -euxo pipefail

          binary="../tglock-cli-aarch64-unknown-linux-musl"

          file "$binary"

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Final binary contains PT_INTERP."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Final binary has shared-library dependencies."
            exit 1
          fi

          echo "Final binary is STATIC."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: src/tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: src/tglock-cli-aarch64-unknown-linux-musl
