name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    name: Tag must point to default branch HEAD
    runs-on: ubuntu-latest

    steps:
      - name: Verify tag is on default branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .sha)

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME and $branch point to $head — building."
            exit 0
          fi

          echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, but $branch points to $head."
          echo "Move the tag to the current default-branch HEAD and push it again."
          exit 1

  cli-aarch64-musl:
    name: Headless CLI — Linux aarch64 musl
    needs: guard
    runs-on: ubuntu-22.04

    container:
      image: messense/rust-musl-cross:aarch64-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static CLI
        shell: bash
        env:
          TARGET: aarch64-unknown-linux-musl
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          cargo build \
            --release \
            --locked \
            --no-default-features \
            --features cli \
            --bin tglock-cli \
            --target "$TARGET"

          cp "target/$TARGET/release/tglock-cli" "$ASSET"
          chmod +x "$ASSET"

      - name: Verify binary
        shell: bash
        env:
          TARGET: aarch64-unknown-linux-musl
          ASSET: tglock-cli-aarch64-unknown-linux-musl
        run: |
          set -euxo pipefail

          file "$ASSET"

          # Must be an ARM64 ELF executable.
          file "$ASSET" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

          # Static musl executable must not have a dynamic ELF interpreter.
          if readelf -l "$ASSET" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked; PT_INTERP is present."
            readelf -l "$ASSET"
            exit 1
          fi

          # Extra sanity check: no shared libraries should be required.
          if command -v ldd >/dev/null 2>&1; then
            ldd "$ASSET" || true
          fi

          # Make sure the actual CLI binary works.
          # It cannot execute on the x86_64 GitHub runner, so inspect it
          # instead of trying to run --version here.
          readelf -h "$ASSET"
          readelf -l "$ASSET"

          echo "Static aarch64-musl CLI verified."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: tglock-cli-aarch64-unknown-linux-musl
