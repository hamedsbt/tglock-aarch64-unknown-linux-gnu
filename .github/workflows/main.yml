name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli-aarch64-musl:
    name: Static CLI — aarch64-unknown-linux-musl
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Locate Cargo project
        run: |
          set -eux

          find . -maxdepth 5 -name Cargo.toml -print

      - name: Build
        run: |
          set -euxo pipefail

          cross build \
            --release \
            --locked \
            --no-default-features \
            --features cli \
            --bin tglock-cli \
            --target aarch64-unknown-linux-musl

      - name: Prepare binary
        run: |
          set -euxo pipefail

          cp \
            target/aarch64-unknown-linux-musl/release/tglock-cli \
            tglock-cli-aarch64-unknown-linux-musl

          chmod +x tglock-cli-aarch64-unknown-linux-musl

      - name: Verify architecture and static linking
        run: |
          set -euxo pipefail

          binary=tglock-cli-aarch64-unknown-linux-musl

          file "$binary"

          file "$binary" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

          echo "=== Program headers ==="
          readelf -l "$binary"

          echo "=== Dynamic section ==="
          readelf -d "$binary" || true

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked: PT_INTERP found."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Binary has dynamic shared-library dependencies."
            exit 1
          fi

          echo "OK: static aarch64-musl binary."

      - name: Strip
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            messense/rust-musl-cross:aarch64-musl \
            musl-strip \
            /work/tglock-cli-aarch64-unknown-linux-musl

      - name: Final static check
        run: |
          set -euxo pipefail

          binary=tglock-cli-aarch64-unknown-linux-musl

          file "$binary"

          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::PT_INTERP found after stripping."
            exit 1
          fi

          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Dynamic dependency found after stripping."
            exit 1
          fi

          echo "Final binary is static."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: tglock-cli-aarch64-unknown-linux-musl
