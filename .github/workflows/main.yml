name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Static CLI — aarch64-unknown-linux-musl
    runs-on: ubuntu-22.04

    steps:
      # The workflow repository does not contain the Rust source.
      # Build directly from the upstream TGLock repository.
      - name: Checkout TGLock
        uses: actions/checkout@v6
        with:
          repository: by-sonic/tglock
          ref: main
          fetch-depth: 1

      - name: Verify source
        run: |
          set -euxo pipefail

          test -f Cargo.toml
          test -f Cargo.lock

          echo "Source:"
          git remote -v
          git rev-parse HEAD

          echo "Cargo:"
          cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Build static aarch64-musl CLI
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/rust/src" \
            -w /home/rust/src \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            cargo build \
              --release \
              --locked \
              --no-default-features \
              --features cli \
              --bin tglock-cli \
              --target aarch64-unknown-linux-musl

      - name: Copy binary
        run: |
          set -euxo pipefail

          cp \
            target/aarch64-unknown-linux-musl/release/tglock-cli \
            tglock-cli-aarch64-unknown-linux-musl

          chmod +x tglock-cli-aarch64-unknown-linux-musl

      - name: Strip binary
        run: |
          set -euxo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/rust/src" \
            -w /home/rust/src \
            ghcr.io/rust-cross/rust-musl-cross:aarch64-musl \
            musl-strip \
            /home/rust/src/tglock-cli-aarch64-unknown-linux-musl

      - name: Verify binary
        run: |
          set -euxo pipefail

          binary="tglock-cli-aarch64-unknown-linux-musl"

          echo "=== file ==="
          file "$binary"

          echo "=== ELF header ==="
          readelf -h "$binary"

          echo "=== program headers ==="
          readelf -l "$binary"

          echo "=== dynamic section ==="
          readelf -d "$binary" || true

          # Must be ARM64 / aarch64.
          file "$binary" | grep -E \
            'ELF 64-bit.*ARM aarch64.*executable'

          # Static binary must not have an ELF interpreter.
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo "::error::Binary is dynamically linked: PT_INTERP found."
            exit 1
          fi

          # Static binary must not require shared libraries.
          if readelf -d "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo "::error::Binary has dynamic shared-library dependencies."
            readelf -d "$binary"
            exit 1
          fi

          echo "========================================"
          echo "OK: static aarch64-unknown-linux-musl"
          echo "========================================"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tglock-cli-aarch64-unknown-linux-musl
          path: tglock-cli-aarch64-unknown-linux-musl
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: tglock-cli-aarch64-unknown-linux-musl
          prerelease: false
